<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENS,math — Notation</title>
<style>
  :root {
    --charcoal: #1C1A17;
    --charcoal-raised: #262320;
    --gold: #D9A02D;
    --gold-dim: #9C7220;
    --bone: #F2ECDE;
    --bone-dim: #8C8579;
    --slate: #5C6B76;
    --slate-text: #8A99A3;
    --slate-dim: #3E4A53;
    --rule: #3A362E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--charcoal); }

  body {
    background: var(--charcoal);
    color: var(--bone);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    line-height: 1.7;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px 120px;
  }

  header {
    padding: 64px 0 40px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 48px;
  }

  .mark {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .mark .comma { color: var(--gold); }

  .site-tagline {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--bone-dim);
    font-family: 'Courier New', ui-monospace, monospace;
  }

  .back-link {
    display: inline-block;
    margin-top: 18px;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 13px;
    color: var(--slate-text);
    text-decoration: none;
    border-bottom: 1px solid var(--slate-dim);
  }
  .back-link:hover { border-bottom-color: var(--slate); }

  .page-eyebrow {
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  h1.page-title {
    font-family: 'Iowan Old Style', Georgia, serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.15;
    color: var(--bone);
    margin-bottom: 20px;
  }

  .intro {
    font-size: 16px;
    color: var(--bone-dim);
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }
  .intro strong { color: var(--bone); }
  .intro a, .intro a:visited { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold-dim); }
  .intro a:hover { text-decoration-color: var(--gold); }

  .term {
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }
  .term:last-of-type { border-bottom: none; }

  .term-name {
    font-family: 'Iowan Old Style', Georgia, serif;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .term-source {
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--slate-text);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .term p { color: var(--bone); margin-bottom: 12px; }
  .term p:last-child { margin-bottom: 0; }

  .term a { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold-dim); }
  .term a:visited { color: var(--gold); }
  .term a:hover { text-decoration-color: var(--gold); }

  .term-example {
    background: var(--charcoal-raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 14px;
    color: var(--bone);
    margin-top: 12px;
  }

  footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 12px;
    color: var(--bone-dim);
  }
  .footer-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .footer-row .comma { color: var(--gold); }
  footer a { color: var(--slate-text); text-decoration: none; margin-right: 16px; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    h1.page-title { font-size: 26px; }
    body { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">ENS<span class="comma">,</span>math</div>
    <div class="site-tagline">chasing a pattern, notes from an untrained mind</div>
    <a href="index.html" class="back-link">&larr; back to the archive</a>
  </header>
